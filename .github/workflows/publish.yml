name: Publish plugin
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  actions: read
concurrency:
  group: plugin-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: npm-publish
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.3
      - run: bun install --frozen-lockfile
      - run: bun scripts/release-check.ts && bun test && bun run check
      # Temporary immutable preview CLI until plugin commands are npm-released.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: gotempsh/temps
          ref: 96e4c0c2879e7593692245a77002887b247adc89
          path: .publisher
          persist-credentials: false
      - run: bun install --frozen-lockfile --ignore-scripts
        working-directory: .publisher
      - name: Restore this run's encrypted recovery state
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_STATE_KEY: ${{ secrets.RELEASE_STATE_KEY }}
        run: |
          test -n "$RELEASE_STATE_KEY"
          count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '[.artifacts[] | select(.name == "release-recovery" and .expired == false)] | length')
          if [ "$count" -gt 0 ]; then
            gh run download "$GITHUB_RUN_ID" --name release-recovery --dir .
            bun scripts/recovery.ts restore
            bun .publisher/apps/temps-cli/src/index.ts plugin build --all
          fi
      - name: Publish native packages and submit
        env:
          TEMPS_CLOUD_TOKEN: ${{ secrets.TEMPS_CLOUD_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          test -n "$TEMPS_CLOUD_TOKEN" && test -n "$NPM_TOKEN"
          export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/plugin.npmrc"
          umask 077
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > "$NPM_CONFIG_USERCONFIG"
          trap 'rm -f "$NPM_CONFIG_USERCONFIG"' EXIT
          bun .publisher/apps/temps-cli/src/index.ts plugin publish --yes
      - name: Encrypt recovery journal
        if: always()
        env:
          RELEASE_STATE_KEY: ${{ secrets.RELEASE_STATE_KEY }}
        run: bun scripts/recovery.ts save
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: release-recovery
          path: release-state.enc
          if-no-files-found: ignore
          overwrite: true
          retention-days: 7
